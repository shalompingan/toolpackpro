<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="accentBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#FAFAF8"/>
  <rect x="0" y="0" width="14" height="630" fill="url(#accentBar)"/>

  <!-- Logo -->
  <text x="90" y="110" font-family="Liberation Sans, Arial, sans-serif" font-weight="700" font-size="34" fill="#2563EB">ToolPack<tspan fill="#D97706"> Pro</tspan></text>

  <!-- Headline -->
  <text x="90" y="290" font-family="Liberation Sans, Arial, sans-serif" font-weight="700" font-size="62" fill="#1C1917">Free Tile</text>
  <text x="90" y="365" font-family="Liberation Sans, Arial, sans-serif" font-weight="700" font-size="62" fill="#1C1917">Calculator</text>

  <!-- Subheadline -->
  <text x="90" y="420" font-family="Liberation Sans, Arial, sans-serif" font-weight="400" font-size="27" fill="#78716C">Estimate tiles needed for floors &amp; walls</text>

  <!-- Pill badge -->
  <rect x="90" y="455" width="272" height="48" rx="24" fill="#DBEAFE"/>
  <text x="226" y="486" font-family="Liberation Sans, Arial, sans-serif" font-weight="600" font-size="22" fill="#2563EB" text-anchor="middle">Free · No Signup</text>

  <!-- Brand mark -->
  <rect x="880" y="175" width="260" height="260" rx="48" fill="#2563EB"/>
  <text x="1010" y="365" font-family="Liberation Sans, Arial, sans-serif" font-weight="800" font-size="150" fill="#ffffff" text-anchor="middle">T</text>
</svg>
